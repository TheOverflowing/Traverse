name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows cross-compiler
        run: brew install mingw-w64
      - name: Build application
        run: bash scripts/build-app.sh
      - name: Verify app bundle
        run: |
          plutil -lint dist/Traverse.app/Contents/Info.plist
          codesign --verify --deep --strict dist/Traverse.app
